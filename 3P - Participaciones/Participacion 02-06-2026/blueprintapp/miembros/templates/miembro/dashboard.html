{% extends 'base.html' %}
{% block content %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="modern-card">
                
                <div class="mb-4 text-center">
                    <h2 class="fw-bold">¡Bienvenido, {{ current_user.nombre }}!</h2>
                    <p class="text-muted">Resumen de tu actividad</p>
                </div>

                <div class="row g-3">
                    <div class="col-sm-6">
                        <div class="p-3 border rounded text-center bg-light">
                            <h6 class="text-muted text-uppercase fw-bold small">Total Tareas</h6>
                            <h3 class="fw-bold mb-0">{{ total_tareas }}</h3>
                        </div>
                    </div>

                    <div class="col-sm-6">
                        <div class="p-3 border rounded text-center bg-light">
                            <h6 class="text-muted text-uppercase fw-bold small">Completadas</h6>
                            <h3 class="fw-bold mb-0 text-success">{{ tareas_completadas }}</h3>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

{% endblock %}
