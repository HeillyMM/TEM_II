<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Dashboard
        {% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --pink-primary: #ff4785;
            --pink-secondary: #ff7ea5;
            --pink-light: #ffeff3;
            --bg-color: #fcf8fa;
            --text-dark: #2b2b2b;
            --text-muted: #8e8e93;
            --card-bg: #ffffff;
            --shadow-sm: 0 4px 12px rgba(255, 71, 133, 0.05);
            --shadow-md: 0 8px 24px rgba(255, 71, 133, 0.08);
            --border-radius-lg: 20px;
            --border-radius-md: 12px;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
        }

        .sidebar {
            background-color: white;
            min-height: 100vh;
            padding: 20px;
            box-shadow: 2px 0 20px rgba(0,0,0,0.02);
            /* Cambios para flexbox */
            display: flex;
            flex-direction: column;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            text-decoration: none;
            display: block;
            margin-bottom: 2rem;
        }

        .nav-link {
            color: var(--text-muted);
            border-radius: 12px;
            margin-bottom: 8px;
            padding: 12px 20px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background-color: #f8f9fa;
            color: var(--pink-primary);
        }

        .nav-link.active {
            background-color: var(--pink-light);
            color: var(--pink-primary);
            font-weight: 600;
        }

        .modern-card {
            background-color: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow-sm);
            border: none;
        }

        .btn-pink {
            background: linear-gradient(135deg, var(--pink-primary), var(--pink-secondary));
            color: white;
            border: none;
            border-radius: 50px;
        }

        .btn-pink:hover {
            color: white;
        }

        .oculto {
            display: none !important;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-none d-md-block sidebar">
            <!-- Contenedor superior para el logo y menú -->
            <div class="flex-grow-1">
                <a href="#" class="brand-logo"><i class="bi bi-layers-fill"></i> Equipo - Trabajo</a>

                <ul class="nav flex-column">
                    {% if current_user.tipo == "admin" %}
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'bp_core.index' %}active{% endif %}" href="{{url_for('bp_core.index')}}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'bp_miembro.index' %}active{% endif %}" href="{{url_for('bp_miembro.index')}}"><i class="bi bi-people"></i> Miembros</a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'bp_core.index' %}active{% endif %}" href="{{url_for('bp_miembro.dashboard')}}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                    </li>
                    {% endif %}

                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'bp_tarea.index' %}active{% endif %}" href="{{url_for('bp_tarea.index')}}"><i class="bi bi-check2-square"></i> Tareas</a>
                    </li>
                </ul>
            </div>

            <!-- Logout en la parte inferior -->
            <div class="mt-auto">
                <a class="nav-link text-danger" href="{{url_for('bp_auth.logout')}}">
                    <i class="bi bi-box-arrow-right"></i> LOGOUT
                </a>
            </div>
        </nav>

        <!-- Contenido principal -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-5 py-4">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
