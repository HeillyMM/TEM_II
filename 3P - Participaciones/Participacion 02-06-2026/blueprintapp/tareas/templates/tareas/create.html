{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="modern-card">

            <div class="mb-4">
                <h2 class="fw-bold">Crear Tarea</h2>
                <p class="text-muted mb-0">Completa los datos de la nueva tarea</p>
            </div>

            <form action="{{url_for('bp_tarea.create')}}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Descripción</label>
                    <input 
                        type="text" name="descripcion" class="form-control" placeholder="Describa la tarea" required>
                    <div class="mb-4">
                    <br><label class="form-label fw-semibold">Miembro asignado</label>
                    <select name="id_miembro" class="form-select">
                        {% for miembro in miembros %}
                        <option value="{{ miembro.id }}">
                            {{ miembro.nombre }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                </div>

                <div class="mb-4">
                    <input type="checkbox" name="completado" class="form-check-input">
                    <label class="form-check-label fw-semibold">Completado</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-pink px-4"><i class="bi bi-check-circle"></i>Guardar</button>
                    <a href="{{url_for('bp_tarea.index')}}" class="btn btn-light">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
