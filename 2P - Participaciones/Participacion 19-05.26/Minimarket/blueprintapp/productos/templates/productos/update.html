{% extends 'base.html' %}

{% block content %}

<div class="content-area">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Editar Producto</h2>
        </div>

        <a href="{{ url_for('bp_producto.index') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i>Volver</a>

    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form action="{{url_for('bp_producto.update',id=producto.id)}}" method="POST">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nombre del producto</label>
                        <input type="text" name="nombre" class="form-control" placeholder="Ingrese el nombre" value="{{producto.nombre}}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Precio</label>
                        <input type="number" step="0.01" name="precio" class="form-control" placeholder="0.00" value="{{producto.precio}}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Stock</label>
                        <input type="number" name="stock" class="form-control" placeholder="0" value="{{producto.stock}}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Categoría</label>
                        <select name="id_categoria" class="form-select">
                            {% for categoria in categorias %}
                                <option value="{{ categoria.id }}" {% if producto.id_categoria == categoria.id %} selected {% endif %}>{{ categoria.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="disponible" id="disponible" {%if producto.disponible %} checked {% endif %}>
                            <label class="form-check-label" for="disponible">Producto disponible</label>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"></i>Editar Producto</button>
                    <a href="{{ url_for('bp_producto.index') }}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
