<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Tienda - Panel de Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --store-dark-blue: #0d2c52;
            --sidebar-bg: #ffffff;
            --sidebar-border: #e0e0e0;
            --content-bg: #f1f3f5;
            --active-nav-link-color: #3265b7;
            --active-nav-link-bg: #e6f0ff;
            --top-nav-link-hover: #1e4d8e;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--content-bg);
            height: 100vh;
            overflow: hidden;
        }

        .navbar-custom {
            background-color: var(--store-dark-blue);
            color: white;
            padding: 0.5rem 1rem;
            z-index: 1030; 
        }
        .navbar-custom .navbar-brand {
            color: white !important;
            font-weight: 500;
            font-size: 1.25rem;
        }
        .navbar-custom .nav-link {
            color: white !important;
            border-radius: 5px;
            padding: 8px 12px;
            transition: background 0.2s;
        }
        .navbar-custom .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .navbar-custom .nav-link.active {
            background-color: rgba(255, 255, 255, 0.15);
            font-weight: 500;
        }
        .navbar-custom i {
            color: white;
            opacity: 0.8;
        }
        .user-info {
            display: flex;
            align-items: center;
            color: white;
            gap: 10px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            overflow: hidden;
        }
        .main-wrapper {
            display: flex;
            height: calc(100vh - 56px);
        }

        .sidebar-nav {
            width: 250px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            overflow-y: auto;
            padding-top: 1rem;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .sidebar-nav .nav-link {
            color: #555;
            font-size: 0.95rem;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .sidebar-nav .nav-link:hover {
            background-color: #f8f9fa;
        }

        .sidebar-nav .nav-link.active {
            color: var(--active-nav-link-color) !important;
            background-color: var(--active-nav-link-bg);
            font-weight: 600;
            border-left: 3px solid var(--active-nav-link-color);
        }
        
        .sidebar-nav .nav-link i {
            color: #777;
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .sidebar-nav .nav-link.active i {
            color: var(--active-nav-link-color);
        }

        .content-area {
            flex: 1;
            background-color: var(--content-bg);
            overflow-y: auto;
            padding: 30px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom sticky-top shadow-sm">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            <span>SISTEMA DE TIENDA</span>
            <i class="fas fa-shopping-cart"></i>
        </a>
    </nav>

    <div class="main-wrapper">
        <div class="sidebar-nav shadow-sm">
            <nav class="nav flex-column">
                <a class="nav-link {% if request.endpoint == 'bp_core.index'%} active {% endif %}" href="{{url_for('bp_core.index')}}">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a class="nav-link {% if request.endpoint == 'bp_producto.index'%} active {% endif %}"  href="{{url_for('bp_producto.index')}}">
                    <i class="fas fa-th-large"></i> PRODUCTOS
                </a>
                <a class="nav-link {% if request.endpoint == 'bp_categoria.index'%} active {% endif %}"  href="{{url_for('bp_categoria.index')}}">
                    <i class="fas fa-folder"></i> CATEGORÍAS
                </a>
            </nav>
        </div>

        {% block content %}

        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
