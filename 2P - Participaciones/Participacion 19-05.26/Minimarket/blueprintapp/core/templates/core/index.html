{% extends 'base.html' %}

{% block content %}

<div class="content-area">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Dashboard</h2>
            <p class="text-muted mb-0">Panel administrativo del sistema de tienda -- simple</p>
        </div>
    </div>
    <div class="row g-4">

        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-primary text-white rounded p-3"><i class="fas fa-box fa-2x"></i></div>
                    <div>
                        <h6 class="text-muted mb-1">Productos</h6>
                        <h3 class="fw-bold mb-0">{{total_productos}}</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">

                    <div class="bg-success text-white rounded p-3">
                        <i class="fas fa-folder fa-2x"></i>
                    </div>
                    <div>
                        <h6 class="text-muted mb-1">Categorías</h6>
                        <h3 class="fw-bold mb-0">{{ total_categorias }}</h3>
                    </div>

                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">

                    <div class="bg-warning text-white rounded p-3">
                        <i class="fas fa-warehouse fa-2x"></i>
                    </div>

                    <div>
                        <h6 class="text-muted mb-1">Stock Total</h6>
                        <h3 class="fw-bold mb-0">{{ total_stock }}</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
