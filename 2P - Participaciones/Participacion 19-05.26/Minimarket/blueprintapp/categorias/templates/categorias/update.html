{% extends 'base.html' %}

{% block content %}

<div class="content-area">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Editar categoria</h2>
        </div>

        <a href="{{ url_for('bp_categoria.index') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i>Volver</a>

    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form action="{{url_for('bp_categoria.update',id=categoria.id)}}" method="POST">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nombre de la categoria</label>
                        <input type="text" name="nombre" class="form-control" placeholder="Ingrese el nombre" value="{{categoria.nombre}}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Descipción</label>
                        <input type="text" name="descripcion" class="form-control" placeholder="Ingrese el nombre" value="{{categoria.descripcion}}">
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Guardar Edición</button>
                    <a href="{{ url_for('bp_categoria.index') }}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
