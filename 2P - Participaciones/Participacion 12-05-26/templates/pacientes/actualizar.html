{% extends 'base.html' %}
{% block title %}Actualizar Paciente{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card bg-dark border-secondary shadow-sm p-4">
            <h2 class="h4 text-white mb-4 fw-semibold"><i class="bi bi-person-plus me-2"></i>Actualizar Paciente</h2>
            
            <form action="{{ url_for('paciente.actualizar',id=paciente.id_paciente) }}" method="POST"> 
                <div class="mb-3">
                    <label for="nombre" class="form-label text-white-50">Nombre</label>
                    <input name="nombre" type="text" class="form-control bg-dark border-secondary" id="nombre" value="{{paciente.nombre}}" required>
                </div>
                <div class="mb-3">
                    <label for="especialidad" class="form-label text-white-50">Edad</label>
                    <input name="edad" type="int" class="form-control bg-dark border-secondary" id="especialidad" value="{{paciente.edad}}" required>
                </div>
                <div class="mb-3">
                    <label for="telefono" class="form-label text-white-50">Dirección</label>
                    <input name="direccion" type="text" class="form-control bg-dark border-secondary" id="direccion" value="{{paciente.direccion}}">
                </div>
                <div class="mb-4">
                    <label for="correo" class="form-label text-white-50">Telefono</label>
                    <input name="telefono" type="tel" class="form-control bg-dark border-secondary" id="correo" value="{{paciente.telefono}}">
                </div>
                <button type="submit" class="btn btn-light w-100 fw-semibold">Actualizar Paciente</button><br><br>
            </form>
            <a href="{{ url_for('paciente.menu') }}" style="color:rgba(255, 255, 255, 0.699); text-align: center; text-decoration: none;">← Volver</a>
        </div>
    </div>
</div>

{% endblock %}
