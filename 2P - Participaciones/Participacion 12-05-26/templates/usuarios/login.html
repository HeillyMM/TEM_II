<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<!-- d-flex, justify-content-center y align-items-center centran todo. vh-100 le da altura completa a la pantalla -->
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card bg-dark border-secondary shadow-sm p-4">
                    <h2 class="h4 text-white mb-4 fw-semibold"><i class="bi bi-person-plus me-2"></i>LOGIN</h2>
                    
                    <form action="{{ url_for('usuarios.login') }}" method="POST">
                        <div class="mb-3">
                            <label for="nombre" class="form-label text-white-50">Usuario:</label>
                            <input name="username" type="text" class="form-control bg-dark border-secondary" id="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="especialidad" class="form-label text-white-50">Contraseña:</label>
                            <input name="password" type="password" class="form-control bg-dark border-secondary" id="especialidad" required>
                        </div>
                        <button type="submit" class="btn btn-light w-100 fw-semibold">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
